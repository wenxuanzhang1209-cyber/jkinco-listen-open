# NVIDIA GPU overlay: give the Ollama container access to all GPUs.
# NVIDIA GPU 加速覆盖层：让 Ollama 容器使用全部 GPU。
# Usage / 用法：docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
