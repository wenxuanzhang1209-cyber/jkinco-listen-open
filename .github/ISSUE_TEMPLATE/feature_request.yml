name: Feature request
description: Propose a feature or improvement / 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        English or Chinese are both fine. 中英文皆可。
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve? / 想解决什么问题
      description: One sentence on the situation you are in. / 一句话说清楚使用场景。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 期望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 备选方案
      description: If the above is not workable, what else would be acceptable? / 如果上面的方案不可行，还有什么可以接受的做法？
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check / 范围确认
      options:
        - label: This feature must run 100% locally and introduce no cloud dependency. / 该功能应 100% 本地运行，不引入云端依赖。
          required: true
