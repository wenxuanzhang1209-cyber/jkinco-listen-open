name: Feature request
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 一句话说清楚使用场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果上面的方案不可行，还有什么可以接受的做法？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能应 100% 本地运行，不引入云端依赖
          required: true
