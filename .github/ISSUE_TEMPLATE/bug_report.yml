name: Bug report
description: Report a reproducible problem / 提交一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        English or Chinese are both fine. 中英文皆可。
  - type: textarea
    id: describe
    attributes:
      label: What happened? / 问题描述
      description: What did you see, and what did you expect instead? / 发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. docker compose up -d --build
        2. Upload a recording / 上传一段录音
        3. Click ... / 点击……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: The VERSION file or a release tag / 仓库 VERSION 文件或 Release 标签
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, RAM, Docker or manual install, and which model you are running
      placeholder: macOS 14 / 16GB / Docker / qwen2.5:7b-instruct
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Redact anything sensitive first. / 请先抹掉敏感信息。
  - type: checkboxes
    id: hygiene
    attributes:
      label: Confirmation / 红线自查
      options:
        - label: I have not included any secret, token, or sensitive recording in this issue. / 我没有在 Issue 中提交任何密钥、Token 或敏感录音。
          required: true
