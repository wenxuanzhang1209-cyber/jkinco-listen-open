name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    name: Open-source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Red-line scan
        run: python scripts/check_open_source_hygiene.py

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install -r requirements-ci.txt
      # 不要在这里再加 -q：pyproject.toml 的 addopts 里已经有一个了，
      # 两个叠起来就是 -qq，而 -qq 会把「N passed」那行汇总整个吞掉。
      # 失败详情还在、退出码还是 1，所以 CI 该红还是红 —— 但日志里
      # 看不出跑了多少个、挂了几个。出事的时候正是最需要这一行的时候。
      - name: Run tests
        # -rs 把跳过的测试和跳过原因打出来。上一次 CI 显示
        # 「958 passed, 3 skipped」—— 而没人知道是哪三个、为什么。
        # 静默跳过的测试等于没有的覆盖，只是看起来是绿的。
        run: python -m pytest tests-v2 -rs

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: jkinco/jkinco-listen-open:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
